<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huddle: meet people who share your interests</title>
<meta name="theme-color" content="#292f33">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="logo" href="#/">huddle</a>
  <nav>
    <a href="#/">Home</a>
    <a href="#/groups">Groups</a>
    <a href="#/events">Events</a>
    <a href="#/people">People</a>
    <a href="#/inbox">Messages<span class="badge" id="mbadge"></span></a>
  </nav>
  <form id="search" role="search"><input type="search" placeholder="Search events" aria-label="Search events"></form>
  <a class="prodswitch" href="/corp" title="Switch to your company workspace">Huddle Corp</a>
  <div id="me"></div>
</div></header>
<div id="banner"></div>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
  // Opened as a plain file, or the app script can't load: explain what to do instead of showing a blank page.
  function huddleOffline() {
    document.querySelector('.topbar').style.display = 'none';
    document.getElementById('app').innerHTML = '<div style="max-width:520px;margin:40px auto;padding:20px;background:#fff;border:1px solid #ccd6dd;border-radius:4px;font:14px/1.5 Helvetica,Arial,sans-serif;color:#292f33">'
      + '<h2 style="margin:0 0 8px;font-size:1.25rem">Can\'t connect to the Huddle server</h2>'
      + '<p>This page needs its server running to sign you in and load events, so it can\'t work when opened as a file.</p>'
      + '<p style="color:#5c6a75">To run it: open a terminal in the <code>meetup</code> folder, run <code>uvicorn server:app</code>, then visit <code>http://localhost:8000</code>. To just look around, build the no-server demo with <code>python demo/build_demo.py</code>.</p></div>';
  }
  if (location.protocol === 'file:') huddleOffline();
</script>
<script src="/static/app.js"></script>
<script>if (!window.__appLoaded) huddleOffline();</script>
</body>
</html>
